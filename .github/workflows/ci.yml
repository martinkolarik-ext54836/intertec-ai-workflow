name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check Bash syntax
        run: bash -n scripts/*.sh
      - name: Run ShellCheck
        if: runner.os == 'Linux'
        # SC1091: the shared library is sourced at runtime, not analysed here.
        run: shellcheck -e SC1091 scripts/*.sh
      - name: Test review automation
        run: ./scripts/test-review-automation.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $findings = Get-ChildItem scripts/*.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName
          }
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
          }
          # Write-Host is deliberate in these operator-facing scripts, so only
          # errors fail the build.
          if ($findings | Where-Object { $_.Severity -eq "Error" }) { exit 1 }
