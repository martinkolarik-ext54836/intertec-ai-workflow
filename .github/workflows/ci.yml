name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n scripts/*.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Test review automation
        run: ./scripts/test-review-automation.sh
